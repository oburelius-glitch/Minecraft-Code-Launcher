<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft BETA - İndirme </title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Retro Piksel Font -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #1a1a1a;
            margin: 0;
            overflow: hidden; /* Parçacıkların ekran dışına taşmasını engeller */
        }

        /* Minecraft tarzı 3D Buton */
        .mc-button {
            background-color: #5E9D34; /* Çimen yeşili */
            box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.4), inset 4px 4px 0px 0px rgba(255,255,255,0.3);
            border: 4px solid #111;
            transition: all 0.1s ease-in-out;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .mc-button:hover {
            background-color: #6eb73e;
        }

        .mc-button:active {
            box-shadow: inset -2px -2px 0px 0px rgba(0,0,0,0.4), inset 2px 2px 0px 0px rgba(255,255,255,0.3);
            transform: translateY(4px);
        }

        /* Konteyner Kutusu */
        .mc-panel {
            background-color: #866043; /* Toprak rengi */
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05)), repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 25%, #866043 25%, #866043 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05));
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            border: 6px solid #4a3424;
            box-shadow: inset -6px -6px 0px 0px rgba(0,0,0,0.3), inset 6px 6px 0px 0px rgba(255,255,255,0.1), 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* Başlık stili */
        .mc-title {
            color: #ddd;
            text-shadow: 4px 4px 0px #333;
            letter-spacing: 2px;
        }

        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Toast Bildirimi Animasyonu */
        .toast-enter {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-exit {
            transform: translateY(100%);
            opacity: 0;
        }
    </style>
</head>
<body class="text-white h-screen flex flex-col items-center justify-center relative">

    <!-- Arka plan parçacıkları için Canvas -->
    <canvas id="canvas-bg"></canvas>

    <!-- Ana İçerik -->
    <div class="relative z-10 w-full max-w-2xl px-4 animate-fade-in-up">
        <div class="mc-panel p-8 sm:p-12 rounded-lg text-center">
            
            <div class="flex justify-center mb-6">
                <!-- Basit bir toprak/çimen bloğu ikonu (CSS ile yapılmış) -->
                <div class="w-24 h-24 relative border-4 border-black shadow-lg">
                    <div class="absolute top-0 w-full h-1/3 bg-[#5E9D34]"></div>
                    <div class="absolute bottom-0 w-full h-2/3 bg-[#866043]"></div>
                </div>
            </div>

            <h1 class="text-5xl sm:text-7xl font-bold mc-title mb-4">Minecraft BETA</h1>
            
            <p class="text-2xl text-gray-200 mb-8 drop-shadow-md">
                Efsanevi dokular, orijinal grafikler ve nostaljik bloklar. Kurulum dosyasını hemen indir ve maceraya katıl!
            </p>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <!-- İndirme Linki. "Minecraft BETA.rar" dosyası ile aynı klasörde olmalı -->
                <a href="Minecraft BETA.rar" download="Minecraft BETA.rar" id="downloadBtn" class="mc-button text-3xl text-white px-10 py-4 w-full sm:w-auto text-center inline-block cursor-pointer">
                    📥 Dosyayı İndir
                </a>
            </div>
            
            <div class="mt-8 text-gray-400 text-xl flex items-center justify-center gap-2">
                <span>📁 Dosya Boyutu: 1.137 KB</span>
                <span class="mx-2">|</span>
                <span>📦 Format: .rar</span>
            </div>
        </div>
    </div>

    <!-- Başarılı İndirme Bildirimi (Toast) -->
    <div id="toastMsg" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 translate-y-full opacity-0 bg-green-600 border-4 border-black text-white px-6 py-3 text-2xl transition-all duration-300 shadow-xl z-50">
        ✅ İndirme başlatılıyor, iyi oyunlar Ömer!
    </div>

    <script>
        // --- KULLANICI DENEYİMİ (Toast Mesajı) ---
        const downloadBtn = document.getElementById('downloadBtn');
        const toastMsg = document.getElementById('toastMsg');

        downloadBtn.addEventListener('click', () => {
            // Butona tıklandığında mesajı göster
            toastMsg.classList.remove('translate-y-full', 'opacity-0');
            toastMsg.classList.add('toast-enter');

            // 4 saniye sonra mesajı gizle
            setTimeout(() => {
                toastMsg.classList.remove('toast-enter');
                toastMsg.classList.add('translate-y-full', 'opacity-0');
            }, 4000);
        });

        // --- ARKA PLAN PARÇACIK ANİMASYONU (Canvas) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particlesArray = [];
        // Minecraft temalı renkler (Yeşil, Kahverengi, Taş grisi)
        const colors = ['#5E9D34', '#866043', '#7D7D7D', '#4a3424'];

        class Particle {
            constructor() {
                this.size = Math.random() * 15 + 10; // Piksel boyutları
                this.x = Math.random() * (canvas.width - this.size * 2) + this.size;
                this.y = canvas.height + Math.random() * 100;
                this.speedY = (Math.random() * 1.5) + 0.5; // Yukarı doğru hareket
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() * 2 - 1) * 2;
            }
            update() {
                this.y -= this.speedY;
                this.rotation += this.rotationSpeed;
                // Ekrandan çıkınca aşağıdan tekrar başlat
                if (this.y < 0 - this.size) {
                    this.y = canvas.height + this.size;
                    this.x = Math.random() * (canvas.width - this.size * 2) + this.size;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x + this.size/2, this.y + this.size/2);
                ctx.rotate(this.rotation * Math.PI / 180);
                
                // Blok görünümü vermek için gölgeli kare
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                
                // Bloğun iç gölgesi/çerçevesi
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 2;
                ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
                
                ctx.restore();
            }
        }

        function init() {
            // Parçacık sayısını ekran genişliğine göre ayarla
            const particleCount = Math.floor(window.innerWidth / 20);
            for (let i = 0; i < particleCount; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();

        // Ekran boyutu değiştiğinde canvas'ı güncelle
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particlesArray.length = 0; // Eski parçacıkları temizle
            init(); // Yeniden oluştur
        });
    </script>
</body>
</html>
